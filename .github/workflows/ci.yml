name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Python 의존성 설치
        run: pip install -r backend/requirements.txt ruff pytest

      - name: Frontend 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: Python 린트
        run: ruff check backend/

      - name: Frontend 린트
        working-directory: frontend
        run: npm run lint

      - name: Backend 테스트
        run: pytest backend/tests/ -v
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Frontend 빌드 확인
        working-directory: frontend
        run: npm run build

      # 아래 두 스캔은 결과를 보되 빌드를 막지는 않는다(continue-on-error).
      #
      # 의존성 취약점은 이 저장소 코드의 결함이 아니라 외부 패키지 사정으로 수시로
      # 새로 발표된다. 게이트를 차단으로 두면 기능 PR 이 자기 잘못이 아닌 이유로
      # 계속 막히고, 결국 CI 가 상시 빨간 상태가 되어 진짜 실패 신호가 묻힌다.
      #
      # 특히 Node 쪽은 next 의 critical 권고(GHSA-gp8f-8m3g-qvj9 등) 취약 범위가
      # 16.3.0-preview.10 까지라, 해소하려면 Next.js 14 -> 16 메이저 2단계 상향이
      # 필요하다. 이는 별도 과제로 다룬다.
      #
      # 실패해도 job 은 통과하지만 단계는 빨갛게 표시되므로 부채는 계속 보인다.
      # 되돌리려면 아래 continue-on-error 두 줄을 지우면 된다.
      - name: Python 취약점 스캔
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r backend/requirements.txt

      - name: Node 취약점 스캔
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: frontend
