name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Python 의존성 설치
        run: pip install -r backend/requirements.txt ruff pytest

      - name: Frontend 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: Python 린트
        run: ruff check backend/

      - name: Frontend 린트
        working-directory: frontend
        run: npm run lint

      - name: Backend 테스트
        run: pytest backend/tests/ -v
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Frontend 빌드 확인
        working-directory: frontend
        run: npm run build

      - name: Python 취약점 스캔
        run: pip install pip-audit && pip-audit -r backend/requirements.txt

      - name: Node 취약점 스캔
        run: npm audit --audit-level=high
        working-directory: frontend
